<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Exporter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="24" height="24">
          <circle cx="64" cy="64" r="60" fill="currentColor"/>
          <path d="M64 28 L64 88 M40 64 L64 88 L88 64 M40 98 L88 98" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <h1 id="title-main">AI Chat Exporter</h1>
      </div>
      <span class="version">v3.1.0</span>
    </header>

    <!-- Platform Detection Status -->
    <div id="status-card" class="status-card loading">
      <div class="status-pulse"></div>
      <span id="status-text">Detecting platform...</span>
    </div>

    <!-- Actions Section -->
    <main class="actions-section">
      <button id="btn-export-md" class="btn btn-primary" disabled>
        <span class="btn-icon">⬇</span>
        <span>Export as Markdown</span>
      </button>
      <button id="btn-export-json" class="btn btn-secondary" disabled>
        <span class="btn-icon">📁</span>
        <span>Export as JSON</span>
      </button>
    </main>

    <!-- Feedback Message -->
    <div id="feedback-message" class="feedback-message hidden"></div>

    <!-- Settings Accordion -->
    <details class="settings-details">
      <summary class="settings-summary">
        <span class="settings-summary-title">
          <svg class="settings-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Settings
        </span>
        <span class="settings-arrow">▾</span>
      </summary>
      <div class="settings-content">
        <div class="form-group">
          <label for="input-filename-format">Filename Format</label>
          <input type="text" id="input-filename-format" placeholder="{platform}_{title}_{timestampLocal}">
          <p class="help-text">Placeholders: <code>{platform}</code>, <code>{title}</code>, <code>{timestamp}</code>, <code>{timestampLocal}</code>, <code>{tags}</code>, <code>{tag1}</code>-<code>{tag9}</code></p>
        </div>
        <div class="form-group">
          <label for="input-title-prefix">Gemini Chat Title Prefix</label>
          <input type="text" id="input-title-prefix" placeholder="✓ ">
          <p class="help-text">Prefix to strip from Gemini chat titles (e.g., status marks).</p>
        </div>
        <button id="btn-reset-settings" class="btn btn-tertiary">Reset to Defaults</button>
      </div>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
